services:
  ctfd:
    image: ctfd/ctfd:3.8.9
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      REVERSE_PROXY: "true"
      WORKERS: "2"
      UPLOAD_PROVIDER: "s3"
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_REGION: "us-east-1"